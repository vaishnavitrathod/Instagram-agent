<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Post studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffcf6;--surface:#fff;--ink:#2a2140;--mute:#6d6287;--line:#ece5f3;--pink:#f2a7bc;--pink-s:#fff0f3;--lilac-s:#f1ebff;--accent:#b9a3f5;--accent-t:#6b52c9;--on-accent:#2a2140;--phone:#2a2140;
--bad-s:#ffd9d3;--bad-t:#8a2c1f;--ok:#9cc9ad;--ok-s:#e3f1e8;--ok-t:#2f6b4a;--warn:#e9604f;--shadow:0 14px 30px -16px #b9a3f5aa}
@media(prefers-color-scheme:dark){:root{--bg:#150f1f;--surface:#211a31;--ink:#f3edff;--mute:#a99ec5;--line:#352b4d;--pink-s:#3d1f33;--lilac-s:#2c2552;--accent:#a99bff;--accent-t:#a99bff;--ok:#8de3c0;--on-accent:#1b1330;--phone:#0b0713;
--bad-s:#4d231f;--bad-t:#ffb4a8;--ok-s:#1d3d33;--ok-t:#8de3c0;--shadow:0 14px 30px -16px #000a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
.app{max-width:1120px;margin:0 auto;padding:28px 20px 90px}.studio{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px 36px;align-items:start}
.main{min-width:0}.cal,.hist{margin-top:44px}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:40px;font-weight:800;line-height:1.1}h2{font-size:21px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.link{color:var(--mute);font-size:14px}.mute{color:var(--mute)}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--accent-t);outline-offset:2px}
textarea,input{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
textarea:focus-visible,input:focus-visible{outline-offset:0}
.composer{background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.composer textarea{border:0;padding:4px;font-size:18px;resize:none;min-height:60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--pink);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--lilac-s);border-color:var(--accent);color:var(--ink)}
.btn{font:inherit;font-weight:600;padding:10px 20px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:transform .12s,background .15s}
.btn:hover{background:var(--lilac-s)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:transparent}
.btn:disabled{opacity:.5;cursor:wait}
.queue{display:grid;gap:10px;margin:20px 0 0}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px;cursor:pointer}
.item[aria-current=true]{border-color:var(--accent);box-shadow:var(--shadow)}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--pink-s);object-fit:cover;flex:none}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--lilac-s);white-space:nowrap}
.pill.wait{background:var(--pink-s)}.pill.bad{background:var(--bad-s);color:var(--bad-t)}.pill.ok{background:var(--ok-s);color:var(--ok-t)}
#editor{margin-top:20px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px}
.label{font-weight:600}
.cap{min-height:170px;font-size:16px;line-height:1.55;resize:vertical}
.meter{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.warn{background:var(--bad-s);color:var(--bad-t);border-radius:12px;padding:8px 12px;font-size:14px}
details summary{cursor:pointer;color:var(--mute);font-size:14px}details .row{margin-top:10px}details .row input{flex:1;min-width:160px}
.empty{color:var(--mute);padding:6px 4px}
.stage{background:var(--pink-s);border-radius:36px;padding:26px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:100%;max-width:320px;background:var(--surface);border-radius:30px;border:6px solid var(--phone);overflow:hidden;box-shadow:var(--shadow)}
.ph-head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--accent))}
.ph-img{aspect-ratio:1;background:var(--lilac-s);position:relative;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px;padding:18px}
.ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(1.04)}}
.shim{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff77 50%,transparent 70%) 0 0/200% 100%,var(--lilac-s);animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ph-act{display:flex;gap:12px;padding:10px 12px 4px}
.ph-act svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ph-act svg:last-child{margin-left:auto}
.ph-cap{padding:2px 12px 14px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word;min-height:44px}
.tag{color:var(--accent-t)}.more{background:none;border:0;color:var(--mute);padding:0;font:inherit;cursor:pointer}
.note{font-size:12px;color:var(--mute);text-align:center;margin:0;max-width:300px;min-height:18px}
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}.tile[aria-current=true]{border-color:var(--accent)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.tile .meta{padding:8px 10px 10px;display:grid;gap:6px;font-size:13px;justify-items:start}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;justify-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;animation:up .25s ease;transition:opacity .3s}
.toast.bad{background:var(--warn);color:#fff}.toast.out{opacity:0}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.conf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:70}
@media(max-width:900px){.studio{grid-template-columns:1fr}h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px}
.sl{position:relative;width:64px;height:64px;flex:none;border-radius:12px;border:2px solid var(--line);padding:0;overflow:hidden;cursor:pointer;background:none}
.sl[aria-current=true]{border-color:var(--accent)}.sl img{width:100%;height:100%;object-fit:cover;display:block}
.sl span{position:absolute;left:5px;bottom:3px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000a}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:#ffffffd0;color:#2a2140;font-size:18px;line-height:1;cursor:pointer;z-index:2}
.nav.prev{left:8px}.nav.next{right:8px}
.dots{display:flex;justify-content:center;gap:5px;padding-top:8px}.dot{width:6px;height:6px;border-radius:50%;background:var(--line)}.dot.on{background:var(--accent)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding-bottom:2px}
.day{min-height:104px;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.day.off{opacity:.45}.day.today{border-color:var(--pink)}.day.plan{border-color:var(--accent);background:var(--lilac-s)}
.dn{font-size:12px;font-weight:600;color:var(--mute)}
.cp{display:flex;gap:5px;align-items:center;border:0;border-radius:8px;padding:2px 4px 2px 2px;background:var(--lilac-s);font:inherit;font-size:11px;color:var(--ink);cursor:grab;text-align:left}
.cp.ok{background:var(--ok-s)}.cp.bad{background:var(--bad-s)}.cp.wait{background:var(--pink-s)}
.cp[aria-current=true]{outline:2px solid var(--accent)}.cp img{width:22px;height:22px;border-radius:5px;object-fit:cover;flex:none}
@media(max-width:700px){.day{min-height:64px;padding:4px}.cp span{display:none}}
[hidden]{display:none!important}
@media(min-width:901px) and (min-height:760px){.stage{position:sticky;top:20px}}
.drop{border:2px dashed var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--lilac-s)}
.up{position:relative;width:72px;height:72px;flex:none;border-radius:12px;overflow:hidden}
.up img{width:100%;height:100%;object-fit:cover;display:block}
.up button{position:absolute;border:0;border-radius:99px;background:#000a;color:#fff;font-size:13px;line-height:1;width:20px;height:20px;padding:0;cursor:pointer}
.up .x{top:3px;right:3px}.up .l{bottom:3px;left:3px}.up .r{bottom:3px;right:3px}
.learn{margin:14px 4px 0;color:var(--mute);font-size:14px}.learn summary{cursor:pointer}
.learn ol{margin:8px 0;padding-left:20px;color:var(--ink)}.learn li{margin-bottom:4px}
/* mascot */
.brand{display:flex;align-items:center;gap:14px}
.mascot{display:block;flex:none}.mascot img{display:block;width:120px;height:auto}
.mascot.big{width:fit-content;margin:0 auto 6px}.mascot.big img{width:220px}
@media(max-width:520px){.mascot img{width:84px}.mascot.big img{width:180px}}
/* agent activity timeline */
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:2px;font-size:14px}
.tl li{position:relative;display:flex;gap:8px;align-items:baseline;padding:4px 0}
.tl li::before{content:"";position:absolute;left:-24px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl li.wait::before{background:var(--pink);animation:pulse 1.4s ease-in-out infinite}
.tl li.you::before{background:var(--ok)}
.tl li.bad::before{background:var(--warn)}
.tl .d{color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .ms{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.tlbox summary{color:var(--ink);font-weight:600}
</style></head><body>
<div class="app">
<div class="studio">
<main class="main">
  <header class="top"><div class="brand"><picture class="mascot"><source media="(prefers-reduced-motion: reduce)" srcset="/assets/cat-still.png"><img src="/assets/cat.webp" alt="" width="300" height="169"></picture><h1>Post studio</h1></div><a class="link" href="/logout">Log out</a></header>
  <section class="composer" aria-label="New post">
    <label class="sr" for="topic">What should the post be about?</label>
    <textarea id="topic" rows="2" placeholder="Describe the post, for example: a motivational quote with an anime-style image"></textarea>
    <div class="row"><div class="chips" id="format" role="group" aria-label="Post format"></div><label class="mute" id="slidesWrap" hidden>Slides <input id="slides" type="number" min="2" max="10" value="4" style="width:72px;display:inline-block"></label><span id="plan"></span></div>
    <label class="mute" id="overlayWrap"><input id="overlay" type="checkbox" style="width:auto;display:inline-block;vertical-align:middle"> Write the text on the images</label>
    <div id="drop" class="drop" hidden>
      <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <div class="row"><button class="btn" id="pickFiles" type="button">Choose images</button><span class="mute">or drop up to 10 here. Their order is the slide order.</span></div>
      <div class="strip" id="ups"></div>
    </div>
    <div class="row"><div class="chips" id="suggest"></div><button class="btn primary" id="go" type="button">Generate post</button></div>
  </section>
  <details class="learn" id="learn" hidden><summary id="learnSum">The agent learns your voice from the posts you approve.</summary>
    <div id="learnList"></div>
    <div class="row"><button class="btn danger" id="learnReset" type="button">Reset what it learned</button></div></details>
  <section class="queue" id="queue" aria-label="In progress"></section>
  <section id="editor" aria-live="polite"></section>
</main>
<aside class="stage" aria-label="Post preview">
  <div class="phone">
    <div class="ph-head"><span class="avatar"></span>dreamzy_ara</div>
    <div class="ph-img" id="ph-img"></div>
    <div class="dots" id="dots"></div>
    <div class="ph-act" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    </div>
    <div class="ph-cap" id="ph-cap"></div>
  </div>
  <p class="note" id="note"></p>
</aside>
</div>
<section class="cal"><div class="hist-head"><h2 id="calTitle"></h2><div class="row"><button class="btn" id="calPrev" type="button" aria-label="Previous month">‹</button><button class="btn" id="calToday" type="button">Today</button><button class="btn" id="calNext" type="button" aria-label="Next month">›</button></div></div><div class="calgrid" id="cal"></div></section>
<section class="hist"><div class="hist-head"><h2>Posts</h2><div class="chips" id="filters" style="flex:none"></div></div><div class="grid" id="grid"></div></section>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
function el(t,p={},...k){const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(a==='class')e.className=v;else if(a in e)e[a]=v;else e.setAttribute(a,v)}for(const c of k.flat())if(c!=null)e.append(c);return e}
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:undefined);
  if(r.status===401){location.href='/login';throw new Error('Please log in')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
const S={runs:[],posts:[],sel:null,drafts:{},hidden:new Set(),filter:'all',more:false,sig:{},slide:0,month:new Date(),plan:null,fmt:'single'};
const MAXC=2200,fmt=i=>new Date(i).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}),
  when=m=>new Date(Date.now()+m*60000).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),
  pc=s=>({published:'ok',failed:'bad',publishing:'wait'}[s]||'');
const SUGGEST={'Motivational quote':'A motivational quote with a soft anime-style illustration','Behind the scenes':'A behind-the-scenes look at what I am building this week','Product launch':'Announce my new project with a bold, colorful image','Weekend mood':'A cozy weekend mood post with a pastel aesthetic','Quick tip':'A quick tip people can use today, with a clean illustrated image'};
function toast(m,k=''){const t=el('div',{class:'toast '+k,textContent:m});$('#toasts').append(t);setTimeout(()=>t.classList.add('out'),3200);setTimeout(()=>t.remove(),3600)}
function confetti(x,y){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=['#f2a7bc','#b9a3f5','#fff0f3','#e1d8fb','#9cc9ad'];
  for(let i=0;i<24;i++){const s=el('span',{class:'conf'});s.style.left=x+'px';s.style.top=y+'px';s.style.background=c[i%5];document.body.append(s);const a=Math.random()*Math.PI*2,d=60+Math.random()*100;
  s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px) rotate(${Math.random()*360}deg) scale(.6)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove()}}
const btn=(label,fn,cls='')=>{const b=el('button',{class:'btn '+cls,textContent:label,type:'button'});b.addEventListener('click',async e=>{b.disabled=true;try{await fn(e)}catch(err){toast(err.message,'bad')}b.disabled=false});return b};
const active=()=>S.runs.filter(r=>!S.hidden.has(r.thread_id));
const selRun=()=>S.sel&&S.sel.kind==='run'?active().find(r=>r.thread_id===S.sel.id):null;
const selPost=()=>S.sel&&S.sel.kind==='post'?S.posts.find(p=>p.id===S.sel.id):null;
function autoSelect(){if(selRun()||selPost())return;const a=active(),w=a.find(r=>r.status==='waiting')||a[0];S.sel=w?{kind:'run',id:w.thread_id}:null}
function pick(sel){S.sel=sel;S.more=false;S.slide=0;S.sig={};render();if(matchMedia('(max-width:900px)').matches)$('.stage').scrollIntoView({behavior:'smooth',block:'start'})}

async function load(){const s=await api('/api/state');
  const prev=Object.fromEntries(S.runs.map(r=>[r.thread_id,r.status]));
  S.hidden=new Set([...S.hidden].filter(id=>s.runs.some(r=>r.thread_id===id)));
  S.runs=s.runs;S.posts=s.posts;
  for(const r of s.runs)if(prev[r.thread_id]==='working'&&!S.hidden.has(r.thread_id)){
    if(r.status==='waiting')toast('Your post is ready to review');
    if(r.status==='error')toast('A post could not be created','bad')}
  autoSelect();render()}
function render(){renderQueue();renderEditor();renderStage();renderCal();renderPlan();renderHist()}

function renderQueue(){const a=active(),sig=JSON.stringify([a.map(r=>[r.thread_id,r.status,r.review&&r.review.image_url]),S.sel]);
  if(S.sig.q===sig)return;S.sig.q=sig;
  $('#queue').replaceChildren(...a.map(r=>{const w=r.status==='waiting';
    return el('button',{class:'item',type:'button','aria-current':String(!!S.sel&&S.sel.id===r.thread_id),on:{click:()=>pick({kind:'run',id:r.thread_id})}},
      w?el('img',{class:'thumb',src:r.review.image_url,alt:''}):el('div',{class:'thumb'+(r.status==='working'?' pulse':'')}),
      el('div',{class:'clamp',style:'flex:1;min-width:0',textContent:r.topic}),
      el('span',{class:'pill '+(w?'wait':r.status==='error'?'bad':''),textContent:{working:'Drafting',waiting:'Needs your OK',error:'Failed'}[r.status]}))}))}

function ringSvg(f){const c=2*Math.PI*9,s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width','22');s.setAttribute('height','22');
  s.innerHTML=`<circle cx="12" cy="12" r="9" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="${f>1?'var(--warn)':'var(--accent)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${Math.min(f,1)*c} ${c}" transform="rotate(-90 12 12)"/>`;return s}
const WHEN=[['now','Now'],['15','In 15 min'],['60','In 1 hour'],['tom','Tomorrow 9:00'],['pick','Pick a time']];
function minsFor(d){if(d.when==='now')return 0;if(d.when==='pick'){const t=new Date(d.at);return isNaN(t)?0:Math.max(0,Math.round((t-Date.now())/60000))}
  if(d.when==='tom'){const t=new Date();t.setDate(t.getDate()+1);t.setHours(9,0,0,0);return Math.max(0,Math.round((t-Date.now())/60000))}return +d.when}
